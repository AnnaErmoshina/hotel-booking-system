spring:
  application:
    name: hotel-booking-system

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hotel_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:change-me-in-production-please-this-is-a-dev-secret}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  booking:
    # DeadlineCancellationPolicy (service/cancellation) settings.
    # Cancelling >= this many days before check-in is free.
    free-cancellation-days: ${FREE_CANCELLATION_DAYS:2}
    # Otherwise the fee is this % of the booking's total price.
    late-cancellation-penalty-percent: ${LATE_CANCELLATION_PENALTY_PERCENT:50}
  admin:
    # First ADMIN account, created on startup by AdminSeeder if it doesn't
    # exist yet. Override before any real deployment.
    email: ${ADMIN_EMAIL:admin@hotelbooking.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
    first-name: ${ADMIN_FIRST_NAME:System}
    last-name: ${ADMIN_LAST_NAME:Admin}

logging:
  level:
    com.hotelbooking: DEBUG
    org.hibernate.SQL: DEBUG
