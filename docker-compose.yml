version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-booking-db
    environment:
      POSTGRES_DB: ${DB_NAME:-hotel_booking}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - hotel-booking-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-booking-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hotel_booking}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-this-is-a-dev-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hotelbooking.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Admin}
      FREE_CANCELLATION_DAYS: ${FREE_CANCELLATION_DAYS:-2}
      LATE_CANCELLATION_PENALTY_PERCENT: ${LATE_CANCELLATION_PENALTY_PERCENT:-50}
    ports:
      - "8080:8080"

volumes:
  hotel-booking-data:
